# SomaNet conda environment.
#
# Create it with:
#     conda env create -f environment.yml
#     conda activate somanet
#
# Notes
# -----
# * torch/torchvision are the CUDA 12.1 builds the reported results were produced
#   with (GPU with CUDA 12.1 driver). For a different CUDA version, change the
#   --extra-index-url tag (e.g. cu118) and the torch/torchvision build to match.
# * The DINOv2 backbone is fetched once at first run via torch.hub
#   (facebookresearch/dinov2) — needs internet. xformers is not required; the
#   code runs with XFORMERS_DISABLED=1.
# * The standalone utility utils/merge_log_events.py (optional, for merging
#   TensorBoard event files) additionally needs `tensorflow` — install it
#   separately only if you use that script; it is not needed for train/infer.
name: somanet
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.3.1
      - torchvision==0.18.1
      - numpy==1.26.4
      - scipy==1.11.4
      - scikit-image==0.22.0
      - nibabel==5.2.1
      - imageio==2.37.4
      - pillow==10.3.0
      - opencv-python==4.9.0.80
      - monai==1.3.0
      - timm==0.9.16
      - einops
      - pynvml
      - networkx==3.4.2
      - matplotlib==3.8.4
      - seaborn
      - tqdm==4.70.1
      - pyyaml==6.0.1
      - tensorboard
      - gdown==6.2.0
